[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyteleop-so101-core"
version = "0.1.0"
description = "AnyTeleop-inspired SO101 core with opt-in simulation and hardware workers"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
sim = ["pybullet>=3.2.5,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
